schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Project: ddc - Multiple Sclerosis (MS) vs. Control participant data analysis
  Stack: Python 3.12, Anaconda env "ddc-env", Jupyter notebooks (notebooks/), pandas, numpy, matplotlib, seaborn, scikit-learn, statsmodels, pingouin
  Data: participant data with group (MS / Control), age, gender; MS group is the smallest
  Analysis pipeline: demographics table -> age/gender-matched dataframe (matched to MS) -> predictor selection -> data exploration -> correlation analysis (across + within group) -> elastic net / multinomial logistic regression (controls dummy-coded to 0)
  Conventions: notebooks in notebooks/, data in data/, use preprocessed data for predictors, controls dummy-coded to 0 in the outcome
  Testing: validate via running the notebook end-to-end

